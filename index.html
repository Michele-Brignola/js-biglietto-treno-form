<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Michele Brignola" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-biglietti</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer="true"></script>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <!-- JS -->
    <script type="text/javascript" src="./js/main.js" defer="true"></script>
  </head>
  <body>
    <section class="container text-center py-3">
      <h1>CALCOLA IL PREZZO DEL TUO BIGLIETTO</h1>
    </section>

    <section class="container py-3">
      <div>
        <form id="form" class="row g-3">
          <div class="col-4">
            <label for="name">Nome Cognome</label>
            <input id="nome" type="text" placeholder="Nome" />
          </div>
          <div class="col-4">
            <label for="km">Km da percorrere</label>
            <input id="km" type="number" placeholder="Km" />
          </div>
          <div class="col-4">
            <label for="name">Fascia d'età</label>
            <select id="eta" name="eta">
              <option value="">Seleziona...</option>
              <option value="maggiorenne">Maggiorenne</option>
              <option value="minorenne">Minorenne</option>
              <option value="65+">Over 65</option>
            </select>
          </div>
          <input type="submit" value="Invia" />
        </form>
      </div>
    </section>
  </body>
</html>
